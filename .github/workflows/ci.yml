name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test on macOS 15
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/Cellar/yt-dlp
          key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Install xcodegen and yt-dlp via Homebrew
        run: |
          set -o pipefail
          brew install xcodegen yt-dlp

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen generate

      - name: Build (Debug)
        run: |
          set -o pipefail
          xcodebuild \
            -project Fetch.xcodeproj \
            -scheme Fetch \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project Fetch.xcodeproj \
            -scheme FetchTests \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test
